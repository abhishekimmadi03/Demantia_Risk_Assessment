<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScreeningSystem AI · Admin Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b1a2a;
            position: relative;
            overflow: hidden;
        }

        /* Full-screen background image with overlay */
        .login-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1559757175-5700dde675bc?ixlib=rb-4.0.3&auto=format&fit=crop&w=2070&q=80');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: brightness(0.35) saturate(1.2);
            z-index: 0;
        }

        /* soft gradient overlay for better readability */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(20, 50, 70, 0.65) 0%, rgba(6, 20, 30, 0.9) 90%);
            z-index: 1;
        }

        /* login card container */
        .login-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 460px;
            margin: 0 20px;
        }

        .login-card {
            background: rgba(18, 34, 48, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(95, 158, 160, 0.4);
            border-radius: 40px;
            padding: 45px 40px 50px;
            box-shadow: 0 35px 65px -15px rgba(0, 0, 0, 0.7);
            transition: transform 0.3s ease;
        }

        .login-card:hover {
            border-color: #d4af37;
            box-shadow: 0 40px 70px -10px #000000cc;
        }

        /* brand / header */
        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-icon {
            background: linear-gradient(145deg, #2b5f73, #1d3e55);
            width: 100px;
            height: 100px;
            border-radius: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border: 1px solid #9fb7c9;
            box-shadow: 0 0 25px #5f9ea0;
            position: relative;
        }

        /* MEMORY ASSESSMENT LOGO: now only clipboard (brain removed) */
        .logo-memory-only {
            font-size: 4.2rem;
            background: linear-gradient(145deg, #f3cd96, #f0e68c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 6px #d4af37);
        }

        /* small gold badge to emphasize assessment (keep it) */
        .memory-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: #d4af37;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: #0b1a2a;
            border: 2px solid #2b5f73;
        }

        .brand h2 {
            font-size: 2.2rem;
            font-weight: 600;
            background: linear-gradient(145deg, #c7e9f0, #ffe3a4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .brand p {
            color: #b0d4de;
            font-size: 0.95rem;
            opacity: 0.9;
        }

        /* form styling */
        .input-group {
            margin-bottom: 24px;
        }

        .input-group label {
            display: block;
            color: #d4e3ed;
            font-weight: 500;
            font-size: 0.95rem;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .input-field {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #3d6677;
            border-radius: 40px;
            padding: 16px 22px;
            font-size: 1rem;
            color: white;
            outline: none;
            transition: all 0.25s;
        }

        .input-field:focus {
            border-color: #d4af37;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
        }

        .input-field::placeholder {
            color: #8ba3b4;
            font-weight: 300;
            font-size: 0.95rem;
        }

        /* show/hide password toggle */
        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #8ba3b4;
            cursor: pointer;
            font-size: 1.2rem;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: #d4af37;
        }

        /* options row */
        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 28px;
            font-size: 0.9rem;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #c0d6df;
        }

        .remember input {
            width: 18px;
            height: 18px;
            accent-color: #5f9ea0;
            border-radius: 4px;
        }

        .forgot-link {
            color: #d4af37;
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px dashed #5f9ea0;
        }

        .forgot-link:hover {
            color: #f5d76e;
            border-bottom-color: #f5d76e;
        }

        /* login button */
        .login-btn {
            width: 100%;
            background: linear-gradient(145deg, #2b5876, #1d435a);
            border: 1px solid #5f9ea0;
            border-radius: 60px;
            padding: 16px 25px;
            font-size: 1.3rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 15px 25px -8px #000000;
        }

        .login-btn i {
            font-size: 1.5rem;
            color: #f0e68c;
        }

        .login-btn:hover {
            background: #1f4f6e;
            border-color: #d4af37;
            transform: scale(1.01);
            box-shadow: 0 20px 30px -6px black;
        }

        /* user redirect */
        .user-redirect {
            text-align: center;
            margin-top: 27px;
            color: #adc9d6;
        }

        .user-redirect a {
            color: #f0e68c;
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px solid #5f9ea0;
        }

        .user-redirect a:hover {
            color: white;
            border-bottom-color: #d4af37;
        }

        /* footer */
        .footer-note {
            position: absolute;
            bottom: 18px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #7a9eb0;
            z-index: 2;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        /* responsiveness */
        @media (max-width: 480px) {
            .login-card {
                padding: 35px 25px 40px;
            }

            .brand h2 {
                font-size: 1.9rem;
            }
        }
    </style>
</head>
<body>

    <!-- background image + overlay -->
    <div class="login-bg"></div>
    <div class="overlay"></div>

    <!-- login card -->
    <div class="login-container">
        <div class="login-card">
            <div class="brand">
                <!-- MEMORY ASSESSMENT LOGO: only clipboard (brain removed as requested) -->
                <div class="brand-icon">
                    <i class="fas fa-clipboard-list logo-memory-only"></i>
                    <!-- small gold badge to emphasize assessment -->
                    <div class="memory-badge">
                        <i class="fas fa-check" style="font-size: 0.8rem;"></i>
                    </div>
                </div>
                <h2>Admin Login</h2>
                <p>Memory Assessment</p>
            </div>
            <form method="POST">
                {% csrf_token %}
                <div class="input-group">
                    <label for="username"><i class="fas fa-user-md" style="margin-right: 8px; color: #9fb7c9;"></i>Username</label>
                    <input type="text" id="username" name="username" class="input-field" placeholder="Enter Username" required>
                </div>

                <div class="input-group">
                    <label for="password"><i class="fas fa-lock" style="margin-right: 8px; color: #9fb7c9;"></i>Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" class="input-field" placeholder="Enter Password" required>
                        <i class="fas fa-eye toggle-password" id="togglePassword" onclick="togglePasswordVisibility()"></i>
                    </div>
                </div>

                <div class="login-options">
                    <label class="remember">
                        <input type="checkbox" checked> <span>Keep me signed in</span>
                    </label>
                    <a href="#" class="forgot-link">forgot password?</a>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Access Dashboard
                </button>
            </form>
        </div>
    </div>

    <!-- footer note -->
    <div class="footer-note">
        <i class="fas fa-shield-alt" style="margin-right: 6px;"></i> HIPAA compliant simulation · memory assessment portal
    </div>
</body>
</html>
