<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScreeningSystem AI · User Signup</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: flex-start; /* Changed from center to allow scrolling */
            justify-content: center;
            background: #0f2a38;
            position: relative;
            overflow-y: auto; /* Changed from hidden to auto to enable scrolling */
            padding: 20px 0; /* Add some padding for top and bottom */
        }

        /* Full-screen background image (softer, friendly) */
        .signup-bg {
            position: fixed; /* Changed from absolute to fixed */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1506126613408-eca07ce68773?ixlib=rb-4.0.3&auto=format&fit=crop&w=2070&q=80');
            background-size: cover;
            background-position: center 30%;
            background-repeat: no-repeat;
            filter: brightness(0.4) saturate(1.1);
            z-index: 0;
        }

        /* warm gradient overlay */
        .overlay {
            position: fixed; /* Changed from absolute to fixed */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(70, 100, 120, 0.6) 0%, rgba(10, 30, 40, 0.85) 90%);
            z-index: 1;
        }

        /* signup card container */
        .signup-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 500px;
            margin: 40px 20px; /* Increased margin to ensure spacing when scrolling */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .signup-card {
            background: rgba(25, 45, 55, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 44px;
            padding: 45px 40px 50px;
            box-shadow: 0 35px 65px -15px rgba(0, 0, 0, 0.7);
            transition: transform 0.3s ease;
            width: 100%;
        }

        .signup-card:hover {
            border-color: #d4af37;
            box-shadow: 0 40px 70px -10px #000000cc;
        }

        /* brand / header */
        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-icon {
            background: linear-gradient(145deg, #2f6b7a, #1d4b55);
            width: 100px;
            height: 100px;
            border-radius: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border: 1px solid #d4af37;
            box-shadow: 0 0 25px #d4af37;
            position: relative;
        }

        /* USER LOGO (clipboard-heart) – exactly as in user login */
        .logo-user {
            font-size: 4.2rem;
            background: linear-gradient(145deg, #f8d9a0, #ffeaa5);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 6px #f1c40f);
        }

        /* small badge = self assessment */
        .user-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: #f0a500;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            color: #0b1a2a;
            border: 2px solid #1d4b55;
        }

        .brand h2 {
            font-size: 2.2rem;
            font-weight: 600;
            background: linear-gradient(145deg, #f5e6b8, #ffe3a4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .brand p {
            color: #c4dde8;
            font-size: 0.95rem;
            opacity: 0.95;
        }

        /* form styling */
        .input-group {
            margin-bottom: 22px;
        }

        .input-group label {
            display: block;
            color: #e2f0f5;
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }

        .input-field {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid #5f9ea0;
            border-radius: 40px;
            padding: 15px 22px;
            font-size: 1rem;
            color: white;
            outline: none;
            transition: all 0.25s;
        }

        .input-field:focus {
            border-color: #f1c40f;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 3px rgba(241, 196, 15, 0.2);
        }

        .input-field::placeholder {
            color: #aac3cf;
            font-weight: 300;
            font-size: 0.9rem;
        }

        /* password wrapper for toggle */
        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #aac3cf;
            cursor: pointer;
            font-size: 1.2rem;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: #f1c40f;
        }

        /* name row – first & last (optional) */
        .name-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* terms & conditions */
        .terms {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 25px 0 20px;
            color: #d4e6ed;
            font-size: 0.9rem;
        }
        .terms input {
            width: 18px;
            height: 18px;
            accent-color: #d4af37;
            cursor: pointer;
        }
        .terms a {
            color: #f5d76e;
            text-decoration: none;
            border-bottom: 1px dotted #5f9ea0;
        }
        .terms a:hover {
            color: #ffe68f;
            border-bottom-color: #f1c40f;
        }

        /* signup button */
        .signup-btn {
            width: 100%;
            background: linear-gradient(145deg, #2b6c7a, #1b515e);
            border: 1px solid #d4af37;
            border-radius: 60px;
            padding: 16px 25px;
            font-size: 1.3rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 15px 25px -8px #000000;
        }

        .signup-btn i {
            font-size: 1.5rem;
            color: #f5d76e;
        }

        .signup-btn:hover {
            background: #1f6575;
            border-color: #f1c40f;
            transform: scale(1.01);
            box-shadow: 0 20px 30px -6px black;
        }
        .message-container {
            list-style-type: none;
            padding: 0;
            margin-bottom: 20px;
        }

        /* Style for individual messages */
        .message-container li {
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            font-size: 1em;
        }

        /* Success message */
        .message-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        /* Error message */
        .message-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* Warning message */
        .message-warning {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }
        /* link to login */
        .login-redirect {
            text-align: center;
            margin-top: 27px;
            color: #bfdbe7;
        }

        .login-redirect a {
            color: #f5d76e;
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px solid #5f9ea0;
        }

        .login-redirect a:hover {
            color: white;
            border-bottom-color: #d4af37;
        }

        /* footer note */
        .footer-note {
            position: fixed;
            bottom: 18px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #b0cedc;
            z-index: 2;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            pointer-events: none; /* Prevents footer from interfering with clicks */
        }

        /* responsiveness */
        @media (max-width: 500px) {
            .signup-card {
                padding: 35px 25px 40px;
            }
            .brand h2 {
                font-size: 1.9rem;
            }
            .name-row {
                grid-template-columns: 1fr;
                gap: 8px;
            }
        }
    </style>
</head>
<body>

    <!-- background image + overlay (same friendly tone) -->
    <div class="signup-bg"></div>
    <div class="overlay"></div>

    <!-- user signup card -->
    <div class="signup-container">
        <div class="signup-card">
            <div class="brand">
                <div class="brand-icon">
                    <i class="fas fa-clipboard" style="font-size: 2.5rem; color: bisque;"></i>
                    <div class="user-badge">
                        <i class="fas fa-check" style="font-size: 0.8rem;"></i>
                    </div>
                </div>
                <h2>Create account</h2>
                <p>Start your memory assessment journey</p>
            </div>
            {% if messages %}
            <ul>
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="name-row">
                    <div class="input-group">
                        <label for="username"><i class="fas fa-user-pen" style="margin-right: 6px; color: #d4af37;"></i>Username</label>
                        <input type="text" id="username" name="username" class="input-field" placeholder="Username" required>
                    </div>
                    <div class="input-group">
                        <label for="email"><i class="fas fa-envelope" style="margin-right: 8px; color: #d4af37;"></i>Email address</label>
                        <input type="email" id="email" name="email" class="input-field" placeholder="alex.river@example.com" required>
                    </div>
                </div>
                
                <!-- username field -->
                <div class="input-group">
                    <label for="phonenumber"><i class="fas fa-phone-alt" style="margin-right: 6px; color: #d4af37;"></i>Phone Number</label>
                    <input type="text" id="phone_number" name="phone_number" class="input-field" placeholder="**********" required>
                </div>
                <div class="input-group">
                    <label for="age"><i class="fas fa-user-plus" style="margin-right: 6px; color: #d4af37;"></i>Age</label>
                    <input type="text" id="age" name="age" class="input-field" placeholder="eg:10" required>
                </div>
                <!-- password -->
                <div class="input-group">
                    <label for="password"><i class="fas fa-lock" style="margin-right: 8px; color: #d4af37;"></i>Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" class="input-field" placeholder="··········" required>
                        <i class="fas fa-eye toggle-password" id="togglePassword" onclick="togglePasswordVisibility('password', this)"></i>
                    </div>
                </div>

                <!-- confirm password -->
                <div class="input-group">
                    <label for="confirm-password"><i class="fas fa-lock" style="margin-right: 8px; color: #d4af37;"></i>Confirm password</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirm-password" name="confirm_password" class="input-field" placeholder="··········" required>
                        <i class="fas fa-eye toggle-password" id="toggleConfirm" onclick="togglePasswordVisibility('confirm-password', this)"></i>
                    </div>
                </div>
                <div class="input-group">
                    <label for="image"><i class="fas fa-camera"  style="margin-right: 8px; color: #d4af37;"></i> Profile Image</label>
                    <input type="file" id="image" name="image" class="input-field" accept="image/*">
                </div>

                <!-- terms checkbox -->
                <div class="terms">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the <a href="#">Terms of use</a> and <a href="#">Privacy policy</a>.</label>
                </div>

                <button type="submit" class="signup-btn">
                    <i class="fas fa-user-plus"></i> Sign up
                </button>

                <div class="login-redirect">
                    ← already have an account? <a href="/user_login">log in</a>
                </div>
            </form>
        </div>
    </div>

    <!-- footer note -->
    <div class="footer-note">
        <i class="fas fa-heart" style="margin-right: 6px; color: #f0a500;"></i> confidential · memory self-assessment
    </div>

    <!-- script to toggle password visibility (works for both fields) -->
    <script>
        function togglePasswordVisibility(fieldId, iconElement) {
            const pwdInput = document.getElementById(fieldId);
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                iconElement.classList.remove('fa-eye');
                iconElement.classList.add('fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                iconElement.classList.remove('fa-eye-slash');
                iconElement.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
